name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  relevance:
    # Guards ranking quality: SciFact nDCG@10 must not regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin sifter
      - run: |
          mkdir -p data && cd data
          curl -sSLO https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip && unzip -q scifact.zip
      - run: |
          ./target/release/sifter index /tmp/s data/scifact/corpus.jsonl
          # k1=1.2, b=0.75 scores 0.6827 (bench/results/beir.json); BMW must match exactly.
          ./target/release/sifter eval /tmp/s data/scifact/queries.jsonl data/scifact/qrels/test.tsv --k1 1.2 --b 0.75 | tee exh.json
          ./target/release/sifter eval /tmp/s data/scifact/queries.jsonl data/scifact/qrels/test.tsv --k1 1.2 --b 0.75 --bmw | tee bmw.json
          python3 -c 'import json; e=json.load(open("exh.json")); w=json.load(open("bmw.json")); assert e["ndcg@10"] >= 0.68, e; assert (e["ndcg@10"], e["recall@100"]) == (w["ndcg@10"], w["recall@100"]), (e, w)'
